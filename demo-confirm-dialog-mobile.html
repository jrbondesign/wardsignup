<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Dialog Demo - Mobile (390px)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      width: 390px;
      margin: 0 auto;
      background: #F4FAFB;
      font-family: system-ui, -apple-system, sans-serif;
    }
    @keyframes scale-in {
      from {
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 0;
      }
      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-scale-in {
      animation: scale-in 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .animate-fade-in {
      animation: fade-in 0.2s ease-out;
    }
  </style>
</head>
<body class="p-4">
  <!-- Normal state: Slot with 6 signups -->
  <div class="bg-white rounded-2xl shadow-lg p-4">
    <div class="mb-4 pb-4 border-b border-gray-200">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-serif text-xl text-gray-900">Chili Cook-Off</h2>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-orange-50 text-orange-700">
          6/15 filled
        </span>
      </div>
      <div class="text-xs text-gray-500">Wednesday, Oct 23 · 7:00 PM</div>
    </div>

    <div class="mt-3 pt-3 border-t border-gray-100">
      <div class="text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Signed Up</div>
      <div class="space-y-1.5">
        
        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Sarah Johnson</div>
            </div>
          </div>
          <button type="button" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Michael Chen</div>
            </div>
          </div>
          <button type="button" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Emily Rodriguez</div>
            </div>
          </div>
          <button type="button" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">David Kim</div>
            </div>
          </div>
          <button type="button" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Jessica Martinez</div>
            </div>
          </div>
          <button type="button" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Ryan Thompson</div>
            </div>
          </div>
          <button type="button" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div class="fixed inset-0 bg-black/40 z-[200] animate-fade-in"></div>
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-md bg-white rounded-2xl shadow-[0_8px_28px_rgba(8,100,126,0.24)] z-[201] animate-scale-in">
    <div class="p-6">
      <h2 class="text-xl font-bold text-[#0D2B35] mb-3">Remove Ryan Thompson?</h2>
      <p class="text-[#5A8399] text-sm leading-relaxed mb-6">
        They will be taken off Chili Cook-Off and the calendar event will update. This cannot be undone.
      </p>
      <div class="flex gap-3">
        <button type="button" class="flex-1 min-h-[44px] px-4 py-2.5 text-sm font-semibold text-[#0D2B35] bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0E96B0]">
          Cancel
        </button>
        <button type="button" class="flex-1 min-h-[44px] px-4 py-2.5 text-sm font-semibold text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600">
          Remove
        </button>
      </div>
    </div>
  </div>

</body>
</html>
