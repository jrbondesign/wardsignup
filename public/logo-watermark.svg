<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#22C8D8"/>
      <stop offset="50%" stop-color="#0E96B0"/>
      <stop offset="100%" stop-color="#08647E"/>
    </linearGradient>
    <linearGradient id="shim1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shim2" x1="1" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boardG" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#aad4ea"/>
    </linearGradient>
    <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf8fc"/>
    </linearGradient>
    <linearGradient id="clipG" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#d8eef6"/>
      <stop offset="100%" stop-color="#98cae0"/>
    </linearGradient>
    <linearGradient id="clipShine" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="headerG" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0E96B0"/>
      <stop offset="100%" stop-color="#087A96"/>
    </linearGradient>
    <linearGradient id="checkG" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0EA8C0"/>
      <stop offset="100%" stop-color="#086478"/>
    </linearGradient>
    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="13" flood-color="#055068" flood-opacity="0.30"/>
    </filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#055068" flood-opacity="0.12"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="40" y="40" width="320" height="320" rx="72"/>
    </clipPath>
  </defs>

  <!-- App icon background -->
  <rect x="40" y="40" width="320" height="320" rx="72" fill="url(#bg)"/>
  <polygon points="40,40 360,40 40,230" fill="url(#shim1)" clip-path="url(#iconClip)"/>
  <polygon points="360,180 360,360 150,360" fill="url(#shim2)" clip-path="url(#iconClip)"/>

  <g transform="rotate(-4, 200, 205)">

    <!-- Clipboard board -->
    <rect x="86" y="96" width="228" height="226" rx="13" fill="url(#boardG)" filter="url(#boardShadow)"/>

    <!-- Clipboard clip -->
    <rect x="154" y="80" width="92" height="28" rx="13" fill="url(#clipG)"/>
    <rect x="154" y="80" width="92" height="15" rx="13" fill="url(#clipShine)"/>
    <rect x="163" y="86" width="74" height="16" rx="8" fill="#8cc0d8" opacity="0.55"/>
    <circle cx="173" cy="94" r="3.5" fill="#78b0cc" opacity="0.85"/>
    <circle cx="227" cy="94" r="3.5" fill="#78b0cc" opacity="0.85"/>
    <rect x="191" y="87" width="18" height="14" rx="6" fill="#b4d8ea" opacity="0.5"/>
    <line x1="154" y1="107" x2="246" y2="107" stroke="#88b8d0" stroke-width="1" stroke-opacity="0.35"/>

    <!-- Paper sheet -->
    <rect x="98" y="106" width="204" height="208" rx="7" fill="url(#paperG)" filter="url(#paperShadow)"/>

    <!-- Teal header band -->
    <rect x="98" y="106" width="204" height="58" rx="7" fill="url(#headerG)"/>
    <rect x="98" y="145" width="204" height="19" fill="url(#headerG)"/>

    <!-- Church silhouette -->
    <!-- Spire -->
    <polygon points="135,113 130,126 140,126" fill="white" opacity="0.95"/>
    <!-- Spire cap -->
    <rect x="128" y="125" width="14" height="3" rx="1" fill="white" opacity="0.80"/>
    <!-- Tower -->
    <rect x="129" y="127" width="12" height="11" rx="1.5" fill="white" opacity="0.92"/>
    <!-- Tower arch window -->
    <path d="M131,129 Q135,125 139,129 L139,137 L131,137 Z" fill="#0A7A96" opacity="0.45"/>
    <!-- Roof -->
    <polygon points="120,138 135,131 150,138" fill="white" opacity="0.90"/>
    <!-- Nave -->
    <rect x="120" y="137" width="30" height="14" rx="1.5" fill="white" opacity="0.88"/>
    <!-- Door arch -->
    <path d="M131,151 Q135,146 139,151 L139,151 L131,151 Z" fill="#0A7A96" opacity="0.45"/>
    <rect x="131" y="148" width="8" height="3" rx="0" fill="#0A7A96" opacity="0.32"/>
    <!-- Step -->
    <rect x="127" y="150" width="16" height="2.5" rx="1" fill="white" opacity="0.50"/>

    <!-- Header text lines (vague/decorative) -->
    <rect x="161" y="118" width="128" height="8" rx="4" fill="white" opacity="0.82"/>
    <rect x="161" y="131" width="108" height="6" rx="3" fill="white" opacity="0.52"/>
    <rect x="161" y="141" width="118" height="5" rx="2.5" fill="white" opacity="0.36"/>

    <!-- Header divider -->
    <line x1="98" y1="164" x2="302" y2="164" stroke="white" stroke-width="0.5" stroke-opacity="0.18"/>

    <!-- Signup row 1 — checked -->
    <rect x="112" y="174" width="18" height="18" rx="4" fill="white" stroke="#0E96B0" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M115 183 L120 188 L130 175" fill="none" stroke="url(#checkG)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="138" y="177" width="80" height="7" rx="3.5" fill="#0A96B0" opacity="0.22"/>
    <rect x="226" y="177" width="50" height="7" rx="3.5" fill="#0A96B0" opacity="0.12"/>
    <rect x="138" y="188" width="110" height="5" rx="2.5" fill="#0A96B0" opacity="0.10"/>

    <!-- Signup row 2 — checked -->
    <rect x="112" y="208" width="18" height="18" rx="4" fill="white" stroke="#0E96B0" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M115 217 L120 222 L130 209" fill="none" stroke="url(#checkG)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="138" y="211" width="68" height="7" rx="3.5" fill="#0A96B0" opacity="0.22"/>
    <rect x="214" y="211" width="66" height="7" rx="3.5" fill="#0A96B0" opacity="0.12"/>
    <rect x="138" y="222" width="98" height="5" rx="2.5" fill="#0A96B0" opacity="0.10"/>

    <!-- Signup row 3 — checked -->
    <rect x="112" y="242" width="18" height="18" rx="4" fill="white" stroke="#0E96B0" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M115 251 L120 256 L130 243" fill="none" stroke="url(#checkG)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="138" y="245" width="74" height="7" rx="3.5" fill="#0A96B0" opacity="0.22"/>
    <rect x="220" y="245" width="60" height="7" rx="3.5" fill="#0A96B0" opacity="0.12"/>
    <rect x="138" y="256" width="106" height="5" rx="2.5" fill="#0A96B0" opacity="0.10"/>

    <!-- Signup row 4 — checked -->
    <rect x="112" y="276" width="18" height="18" rx="4" fill="white" stroke="#0E96B0" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M115 285 L120 290 L130 277" fill="none" stroke="url(#checkG)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="138" y="279" width="84" height="7" rx="3.5" fill="#0A96B0" opacity="0.22"/>
    <rect x="230" y="279" width="46" height="7" rx="3.5" fill="#0A96B0" opacity="0.12"/>
    <rect x="138" y="290" width="102" height="5" rx="2.5" fill="#0A96B0" opacity="0.10"/>

  </g>

  <!-- Icon outer ring -->
  <rect x="40" y="40" width="320" height="320" rx="72" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.13"/>

</svg>
