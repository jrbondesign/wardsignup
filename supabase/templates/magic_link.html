<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ward Signup Magic Link</title>
</head>
<body style="margin:0;padding:0;background-color:#F4FAFB;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0D2B35;">

  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F4FAFB;padding:48px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:520px;">

          <!-- Logo header -->
          <tr>
            <td align="center" style="padding-bottom:28px;">
              <span style="font-size:22px;font-weight:700;color:#054F64;letter-spacing:1.5px;">Ward Signup</span>
            </td>
          </tr>

          <!-- Main card -->
          <tr>
            <td style="background:#ffffff;border-radius:20px;box-shadow:0 8px 32px rgba(8,100,126,0.10);padding:44px 48px;">

              <!-- Icon -->
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td align="center" style="padding-bottom:24px;">
                    <div style="width:52px;height:52px;background:linear-gradient(135deg,#22C8D8,#08647E);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;line-height:52px;text-align:center;">✉</div>
                  </td>
                </tr>
              </table>

              <h1 style="margin:0 0 12px;font-size:24px;font-weight:700;color:#0D2B35;text-align:center;line-height:1.3;">
                Your sign-in link
              </h1>
              <p style="margin:0 0 28px;font-size:15px;color:#5A8399;line-height:1.65;text-align:center;">
                Click the button below to sign in to Ward Signup.<br>This link expires in <strong style="color:#2E5566;">60 minutes</strong>.
              </p>

              <!-- Log in link -->
              <p style="margin:0;text-align:center;">
                <a href="{{ .ConfirmationURL }}" style="color:#0E96B0;font-size:16px;font-weight:600;text-decoration:underline;">Log in</a>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:28px 0 0;text-align:center;">
              <p style="margin:0;font-size:12px;color:#5A8399;line-height:1.7;">
                <a href="{{ .SiteURL }}" style="color:#5A8399;text-decoration:none;">Ward Signup · wardsignup.com</a><br>
                Made with ❤️ in Arizona
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
