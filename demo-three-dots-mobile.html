<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three-Dots Menu Demo - Mobile (390px)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      width: 390px;
      margin: 0 auto;
      background: #F4FAFB;
      font-family: system-ui, -apple-system, sans-serif;
    }
    @keyframes slide-up {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-slide-up {
      animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .animate-fade-in {
      animation: fade-in 0.2s ease-out;
    }
  </style>
</head>
<body class="p-4">
  <!-- Normal state: Slot with 6 signups and three-dots buttons -->
  <div class="bg-white rounded-2xl shadow-lg p-4 mb-6">
    <div class="mb-4 pb-4 border-b border-gray-200">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-serif text-xl text-gray-900">Chili Cook-Off</h2>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-orange-50 text-orange-700">
          6/15 filled
        </span>
      </div>
      <div class="text-xs text-gray-500">Wednesday, Oct 23 · 7:00 PM</div>
    </div>

    <div class="mt-3 pt-3 border-t border-gray-100">
      <div class="text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Signed Up</div>
      <div class="space-y-1.5">
        
        <!-- Signup 1 -->
        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Sarah Johnson</div>
              <div class="text-xs text-[#5A8399] mt-0.5 space-y-0.5">
                <div>sarah.j@email.com</div>
              </div>
            </div>
          </div>
          <button type="button" aria-label="Options for Sarah Johnson" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#0E96B0]">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <!-- Signup 2 -->
        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Michael Chen</div>
              <div class="text-xs text-[#5A8399] mt-0.5">
                <div>michael.c@email.com</div>
              </div>
            </div>
          </div>
          <button type="button" aria-label="Options for Michael Chen" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <!-- Signup 3 -->
        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Emily Rodriguez</div>
              <div class="text-xs text-[#5A8399] mt-0.5">
                <div>emily.r@email.com</div>
              </div>
            </div>
          </div>
          <button type="button" aria-label="Options for Emily Rodriguez" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <!-- Signup 4 -->
        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">David Kim</div>
              <div class="text-xs text-[#5A8399] mt-0.5">
                <div>david.k@email.com</div>
              </div>
            </div>
          </div>
          <button type="button" aria-label="Options for David Kim" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <!-- Signup 5 -->
        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Jessica Martinez</div>
              <div class="text-xs text-[#5A8399] mt-0.5">
                <div>jessica.m@email.com</div>
              </div>
            </div>
          </div>
          <button type="button" aria-label="Options for Jessica Martinez" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

        <!-- Signup 6 - with menu OPEN -->
        <div class="bg-[#F4FAFB] border border-[#0E96B0]/8 rounded-lg px-3 py-2.5 relative">
          <div class="flex items-start gap-2 pr-10">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-[#0D2B35]">Ryan Thompson</div>
              <div class="text-xs text-[#5A8399] mt-0.5">
                <div>ryan.t@email.com</div>
              </div>
            </div>
          </div>
          <button type="button" aria-label="Options for Ryan Thompson" class="absolute top-2 right-2 w-11 h-11 flex items-center justify-center rounded-lg text-gray-600 bg-gray-100">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </svg>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bottom Sheet Menu (Mobile) -->
  <div class="fixed inset-0 bg-black/30 z-[100] animate-fade-in"></div>
  <div class="fixed bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-[0_-8px_28px_rgba(8,100,126,0.18)] z-[101] animate-slide-up">
    <div class="px-4 py-3 border-b border-gray-200">
      <h3 class="text-base font-semibold text-[#0D2B35]">Options for Ryan Thompson</h3>
    </div>
    <div class="p-2">
      <button type="button" class="w-full min-h-[44px] px-4 py-3 text-left text-red-600 hover:bg-red-50 rounded-lg transition-colors text-sm font-medium">
        Remove from Chili Cook-Off
      </button>
    </div>
    <div class="p-4">
      <button type="button" class="w-full min-h-[44px] px-4 py-3 text-center text-[#0D2B35] bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors text-sm font-medium">
        Cancel
      </button>
    </div>
  </div>

</body>
</html>
